<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TEAM MATE — Developer → Team Mate → Projects</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #06080d;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #eaf4f8; }
      canvas { display: block; width: 100%; height: 100%; }

      #boot { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 26px; text-align: center;
        background: radial-gradient(120% 90% at 50% 10%, #101923 0%, #070a0f 60%, #05070b 100%);
        transition: opacity .6s ease; }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot h1 { font-size: clamp(38px, 8vw, 92px); letter-spacing: .34em; font-weight: 800;
        color: #f1ece3; text-shadow: 0 0 60px rgba(95,216,240,.25); }
      #boot h2 { font-size: clamp(11px, 1.5vw, 14px); letter-spacing: .42em; font-weight: 600;
        color: #7fb6c8; text-transform: uppercase; }
      #boot .flow { display: flex; gap: 14px; align-items: center; font-size: 12px;
        letter-spacing: .28em; color: #9db3bd; }
      #boot .flow i { font-style: normal; color: #5fd8f0; }
      #boot .bar { width: min(420px, 70vw); height: 3px; background: rgba(255,255,255,.1);
        border-radius: 2px; overflow: hidden; }
      #boot .bar i { display: block; height: 100%; width: 12%; background: #5fd8f0;
        box-shadow: 0 0 18px #5fd8f0; transition: width .3s ease; }
      #boot button { pointer-events: auto; cursor: pointer; background: rgba(95,216,240,.1);
        color: #eaf4f8; border: 1px solid rgba(95,216,240,.5); border-radius: 999px;
        padding: 14px 40px; font-size: 13px; letter-spacing: .3em; font-weight: 700;
        font-family: inherit; transition: all .2s ease; }
      #boot button:hover { background: rgba(95,216,240,.24); transform: translateY(-1px); }
      #boot .note { font-size: 11px; letter-spacing: .2em; color: #5d6f78; max-width: 460px;
        line-height: 2; }
      #boot .stage { font-size: 11px; letter-spacing: .26em; color: #6d8794; min-height: 16px; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="boot">
      <h2>Developer &nbsp;<i>→</i>&nbsp; Team Mate &nbsp;<i>→</i>&nbsp; Projects</h2>
      <h1>TEAM MATE</h1>
      <div class="flow"><span>COMMAND DECK</span><i>·</i><span>PROJECT DECK</span><i>·</i><span>ROBOT DOCK</span></div>
      <div class="bar"><i id="boot-bar"></i></div>
      <div class="stage" id="boot-stage">booting ship systems</div>
      <button id="boot-go" disabled>BOARD THE SHIP</button>
      <div class="note">W A S D to fly the pod · mouse to look · E to talk to Team Mate.
        Walk the spine from the command deck to the robot dock and watch the agents work.</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
