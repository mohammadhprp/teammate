# Team Mate default configuration.
#
# `tm` loads one config file: the one passed with `--config` (by default the
# `team-mate.toml` in the working directory, which is the primary's). There is
# no merge across the primary's and a target project's file. Task-level flags
# override it (for example `--harness`, `--max-iterations`).

# Coding harness Team Mate runs in. Workers are native subagents of this
# harness. `tm` resolves it in this order: the `--harness` flag, then the
# TM_HARNESS env var, then this key, then best-effort detection from the
# environment. One of: opencode, codex, claude, pi, omp.
harness = "opencode"

# Directory for the persistent task ledger. It survives the primary session
# ending and holds one directory per project, named after the project slug:
# <state_dir>/<slug>/tasks, /briefs, /reports, /timeline.jsonl, /session.json.
# Only the shared project registry (<state_dir>/projects.json) lives at the
# root. Legacy root-level state is migrated automatically on the next run.
state_dir = "~/.teammate"

# Maximum worker subagents running at once. Advisory: not read by `tm`;
# agent-enforced.
max_concurrent = 3

# Review/rework iterations before escalating to the developer. `tm task new`
# uses this as the default when `--max-iterations` is omitted.
max_iterations = 3

# Review policy: "always" (default) | "on-risk" | "never". "always" means the
# primary reviews every settled worker task; "on-risk" reviews important or
# risky changes; "never" reviews only when the developer asks. Whether a
# separate reviewer worker is used is decided per change, not by this value.
# Advisory: not read by `tm`; agent-enforced.
review_policy = "always"

# Desktop notification when work reaches an important state. Advisory only:
# there is no `tm notify` command; the primary raises notifications through its
# own harness.
notify = true

# Distribute the common and worker skills into a target project when it is set
# up, so a worker there can load them: the overlay installs skills only into the
# primary, but a worker runs in the project's own harness context. Set false to
# manage a project's skills yourself.
distribute_skills = true

# Directory the shared skills are copied from when `tm skills sync` distributes
# them into a project. Default: the resolved harness's skills directory under
# the primary root (what the installer populates). Point it elsewhere with an
# absolute or `~` path to copy from a different source.
# skills_source = "~/my-skills"

# Skills copied into a project. The common layer is shared by the primary and
# workers; the worker layer runs inside the worker's harness context.
worker_skills = [
  "commit-changes", "review-change", "showcase-work", "load-project-context",
  "verify-evidence", "handoff-report", "debug-issue", "agent-browser",
  "worker-role", "accept-assignment", "implement-task", "verify-change",
  "raise-blocker", "report-result", "review-task", "investigate-issue",
  "seo-audit", "content-strategy", "copywriting", "analytics", "ab-testing",
]

# Also list the managed skills in the project's .git/info/exclude so they do not
# show as untracked. Local to the project; never committed.
distribute_git_exclude = true
